errors = "稳定错误码至少覆盖 RiskEvidenceUnavailable(risk_evidence_unavailable)、RiskStructureMissing(risk_structure_missing)、RiskClarificationUnsourced(risk_clarification_unsourced)、RiskContractViolation(risk_contract_failed)，均继承 presales.domain.contracts.DomainError"
